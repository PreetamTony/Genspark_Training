<div class="chatbot-container">
  <!-- Chat Toggle Button -->
  <button 
    class="chat-toggle-btn" 
    (click)="toggleChat()"
    [class.active]="isOpen">
    <div class="chat-icon">
      @if (!isOpen) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      }
    </div>
    <span class="chat-label">Nexbot</span>
  </button>

  <!-- Chat Window -->
  @if (isOpen) {
    <div class="chat-window">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="bot-info">
          <div class="bot-avatar">🤖</div>
          <div class="bot-details">
            <h3>Nexbot</h3>
            <span class="bot-status">AI Assistant</span>
          </div>
        </div>
        <button class="clear-btn" (click)="clearChat()" title="Clear chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
          </svg>
        </button>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages">
        @for (message of messages; track $index) {
          <div class="message" [class.user-message]="message.type === 'user'" [class.bot-message]="message.type === 'bot'">
            <div class="message-content">
              <p>{{ message.content }}</p>
              <span class="message-time">{{ formatTime(message.timestamp) }}</span>
            </div>
          </div>
        }
        
        @if (isTyping) {
          <div class="message bot-message">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        }
      </div>

      <!-- Quick Suggestions -->
      @if (messages.length <= 2) {
        <div class="quick-suggestions">
          <div class="suggestions-label">Quick questions:</div>
          <div class="suggestions-list">
            @for (suggestion of getQuickSuggestions(); track $index) {
              <button class="suggestion-btn" (click)="useSuggestion(suggestion)">
                {{ suggestion }}
              </button>
            }
          </div>
        </div>
      }

      <!-- Message Input -->
      <div class="chat-input">
        <div class="input-wrapper">
          <textarea 
            [(ngModel)]="currentMessage"
            (keypress)="handleKeyPress($event)"
            placeholder="Type your message..."
            rows="1"
            [disabled]="isTyping">
          </textarea>
          <button 
            class="send-btn" 
            (click)="sendMessage()"
            [disabled]="!currentMessage.trim() || isTyping">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
  }
</div>
